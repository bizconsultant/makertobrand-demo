<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find manufacturers · MakerToBrand</title>
  <meta name="description" content="Browse garment manufacturers across Tiruppur, Jaipur, Ludhiana, Surat, Mumbai, Delhi NCR, Bengaluru and Kolkata.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="demo-bar"></div>
  <header id="site-header"></header>
  <main class="page-pad">
    <div class="wrap-wide page-intro">
      <span class="eyebrow ink">The directory</span>
      <h1>Find manufacturers, with a page of their own.</h1>
      <p class="lead">Search by product, city or minimum order size. Open a profile and you will find photographs, capacity, minimums and a way to write to them — a small website, for units that often have none.</p>
    </div>
    <div class="wrap-wide">
      <form class="dir-search" id="dir-search">
        <label class="field"><span>Product or craft</span><input type="search" name="q" id="q" placeholder="e.g. denim, knitwear, kurtas"></label>
        <label class="field"><span>City or hub</span>
          <select name="city" id="city">
            <option value="">All of India</option>
          </select>
        </label>
        <label class="field"><span>Max. minimum order</span>
          <select name="moq" id="moq">
            <option value="">Any MOQ</option>
            <option value="100">Up to 100</option>
            <option value="150">Up to 150</option>
            <option value="250">Up to 250</option>
            <option value="400">Up to 400</option>
            <option value="800">Up to 800</option>
          </select>
        </label>
        <label class="field"><span>Sort</span>
          <select name="sort" id="sort">
            <option value="featured">Featured first</option>
            <option value="rating">Highest rated</option>
            <option value="moq">Lowest MOQ</option>
          </select>
        </label>
        <button class="btn btn-dark" type="submit">Search</button>
      </form>
    </div>
    <div class="wrap-wide layout-filters">
      <aside class="filter-box" id="filters"></aside>
      <div>
        <p class="muted" id="result-count"></p>
        <div class="maker-grid" id="grid"></div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    MTB.init({
      page: "makers",
      after() {
        const hubs = MTB_DATA.hubs.map((h) => h.city);
        const citySel = document.getElementById("city");
        hubs.forEach((c) => {
          const o = document.createElement("option");
          o.value = c; o.textContent = c;
          citySel.appendChild(o);
        });
        const crafts = ["Knitwear", "Denim", "Ethnic wear", "Shirts", "Kidswear", "Festive", "Organic", "Uniforms", "Linen"];
        const certs = [...new Set(MTB_DATA.manufacturers.flatMap((m) => m.certifications))];
        const params = new URLSearchParams(location.search);
        const state = {
          q: params.get("q") || "",
          city: params.get("city") || "",
          moq: params.get("moq") || "",
          sort: params.get("sort") || "featured",
          cat: new Set(),
          cert: new Set(),
          verified: false
        };
        if (params.get("craft")) state.cat.add(params.get("craft"));
        document.getElementById("q").value = state.q;
        citySel.value = state.city;
        document.getElementById("moq").value = state.moq;
        document.getElementById("sort").value = state.sort;

        function box(title, items, key) {
          return `<h3>${title}</h3>` + items.map((c) =>
            `<label><input type="checkbox" data-key="${key}" value="${c}" ${state[key] && state[key].has && state[key].has(c) ? "checked" : ""}> ${c}</label>`
          ).join("");
        }
        document.getElementById("filters").innerHTML =
          `<h3 style="margin-top:0">Show</h3>
           <label><input type="checkbox" id="only-verified"> Verified only</label>` +
          box("Craft", crafts, "cat") + box("Certification", certs, "cert") +
          `<button class="btn btn-ghost btn-sm" type="button" id="clear" style="margin-top:16px">Clear filters</button>`;

        function planRank(m) {
          return m.featured ? 0 : 1;
        }
        function cityOk(m, city) {
          if (!city) return true;
          if (city === "Delhi NCR") return MTB.inDelhiNcr(m);
          return m.city === city || m.state === city;
        }
        function draw() {
          let list = MTB_DATA.manufacturers.filter((m) => {
            if (state.verified && !m.verified) return false;
            if (!cityOk(m, state.city)) return false;
            if (state.moq && m.moq > Number(state.moq)) return false;
            if (state.q && !MTB.makerMatchesQuery(m, state.q) && !MTB.makerMatchesCategory(m, state.q)) return false;
            if (state.cat.size && ![...state.cat].some((c) => MTB.makerMatchesCategory(m, c))) return false;
            if (state.cert.size && !m.certifications.some((c) => state.cert.has(c))) return false;
            return true;
          });
          if (state.sort === "rating") list = list.slice().sort((a,b) => b.rating - a.rating || planRank(a) - planRank(b));
          else if (state.sort === "moq") list = list.slice().sort((a,b) => a.moq - b.moq);
          else list = list.slice().sort((a,b) => planRank(a) - planRank(b) || b.rating - a.rating);
          document.getElementById("result-count").textContent = list.length + " manufacturer" + (list.length === 1 ? "" : "s");
          document.getElementById("grid").innerHTML = list.length ? list.map(MTB.makerCard).join("") : `<div class="empty">No manufacturers match those filters.</div>`;
        }
        document.getElementById("dir-search").addEventListener("submit", (e) => {
          e.preventDefault();
          state.q = document.getElementById("q").value;
          state.city = citySel.value;
          state.moq = document.getElementById("moq").value;
          state.sort = document.getElementById("sort").value;
          const url = new URL(location.href);
          ["q","city","moq","sort"].forEach((k) => {
            if (state[k]) url.searchParams.set(k, state[k]);
            else url.searchParams.delete(k);
          });
          history.replaceState(null, "", url);
          draw();
        });
        document.getElementById("filters").addEventListener("change", (e) => {
          const t = e.target;
          if (t.id === "only-verified") { state.verified = t.checked; draw(); return; }
          const key = t.getAttribute("data-key");
          if (!key) return;
          if (t.checked) state[key].add(t.value); else state[key].delete(t.value);
          draw();
        });
        document.getElementById("clear").addEventListener("click", () => {
          state.cat.clear(); state.cert.clear(); state.verified = false;
          state.q = ""; state.city = ""; state.moq = ""; state.sort = "featured";
          document.getElementById("q").value = "";
          citySel.value = "";
          document.getElementById("moq").value = "";
          document.getElementById("sort").value = "featured";
          document.querySelectorAll("#filters input").forEach((i) => i.checked = false);
          history.replaceState(null, "", location.pathname);
          draw();
        });
        draw();
      }
    });

  </script>
</body>
</html>
