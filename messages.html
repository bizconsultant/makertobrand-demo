<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages · MakerToBrand</title>
  <meta name="description" content="In-app messaging between a brand and a manufacturer. Demo conversation with sample data.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="demo-bar"></div>
  <header id="site-header"></header>
  <main class="page-pad">
    <div class="wrap-wide page-intro">
      <span class="eyebrow ink">Messages</span>
      <h1>A short line between brand and mill.</h1>
      <p class="lead">Talk about a brief, a sample, or a delivery date — without leaving the marketplace.</p>
    </div>
    <div class="wrap-wide">
      <div class="msg-layout" id="root"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/settings.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    MTB.init({
      page: "messages",
      after() {
        const withId = MTB.param("with");
        const threadParam = MTB.param("thread");
        let threads = MTB_DATA.threads.map((t) => JSON.parse(JSON.stringify(t)));
        // Demo: a manufacturer tried to share WhatsApp before a first paid order
        const t1 = threads.find((t) => t.id === "t1");
        if (t1 && !t1.messages.some((m) => m.shareAttempt)) {
          t1.messages.push({
            from: "maker",
            name: "Desert Weave Atelier",
            time: "5 Nov, 15:02",
            text: "If it is easier, WhatsApp me on +91 98290 22014.",
            shareAttempt: true
          });
        }
        // If arriving from a manufacturer profile, open or create a thread
        if (withId && !threads.some((t) => t.withId === withId)) {
          const m = MTB.maker(withId);
          if (m) {
            threads.unshift({
              id: "t-new",
              with: m.name,
              withId: m.id,
              role: "manufacturer",
              preview: "Start a conversation.",
              updated: "Now",
              messages: [
                { from: "system", name: "MakerToBrand", time: "Just now", text: "This is a new conversation with " + m.name + ". Write a message below — it stays on this device." }
              ]
            });
          }
        }
        let current = threads.find((t) => t.id === threadParam) || threads.find((t) => t.withId === withId) || threads[0];
        const session = MTB.getSession();
        const meSide = (session && session.role === "manufacturer") ? "maker" : "brand";

        function isUnlocked() {
          return current.withId ? MTB.contactUnlocked(current.withId) : false;
        }
        function draw() {
          const unlocked = isUnlocked();
          document.getElementById("root").innerHTML = `
            <div class="thread-list">
              ${threads.map((t) => `<button type="button" class="thread-item ${t.id===current.id?"is-on":""}" data-id="${t.id}" style="width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line-soft)">
                <b>${MTB.escapeHtml(t.with)}</b>
                <span>${MTB.escapeHtml(t.preview)}</span>
                <span style="display:block;margin-top:4px">${t.updated}</span>
              </button>`).join("")}
            </div>
            <div class="chat">
              <div style="padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px">
                <div>
                  <strong>${MTB.escapeHtml(current.with)}</strong>
                  <div class="muted" style="font-size:13px">${current.withId ? `<a href="manufacturer.html?id=${current.withId}" style="text-decoration:underline">View profile</a>` : ""}
                    ${unlocked ? ' · <span class="badge badge-ok">Contacts unlocked</span>' : ' · <span class="badge badge-held">Contacts locked</span>'}</div>
                </div>
              </div>
              ${unlocked ? "" : `<div class="msg-protect"><strong>Contacts stay hidden until a first paid order.</strong> Phone numbers, email addresses, WhatsApp and links are masked in this conversation so both sides keep payment protection.</div>`}
              <div class="chat-log" id="log">
                ${current.messages.map((m) => {
                  const mine = m.from === meSide;
                  const shown = unlocked ? m.text : MTB.maskContact(m.text).text;
                  const wasMasked = !unlocked && (m.shareAttempt || MTB.maskContact(m.text).masked);
                  return `<div class="bubble ${mine?"me":""} ${wasMasked?"is-masked":""}"><small>${MTB.escapeHtml(m.name)} · ${m.time}</small>${MTB.escapeHtml(shown)}${wasMasked ? `<span class="mask-flag">Hidden until your first order on MakerToBrand</span>` : ""}</div>`;
                }).join("")}
              </div>
              <form class="chat-compose" id="compose">
                <input name="text" required placeholder="Write a message…" autocomplete="off">
                <button class="btn btn-primary" type="submit">Send</button>
              </form>
            </div>`;
          const log = document.getElementById("log");
          log.scrollTop = log.scrollHeight;
          document.querySelectorAll("[data-id]").forEach((b) => b.addEventListener("click", () => {
            current = threads.find((t) => t.id === b.dataset.id);
            draw();
          }));
          document.getElementById("compose").addEventListener("submit", (e) => {
            e.preventDefault();
            const raw = new FormData(e.target).get("text").trim();
            if (!raw) return;
            const name = (session && session.name) || (meSide === "maker" ? "Loom & Lattice" : "Nila Atelier");
            const unlockedNow = isUnlocked();
            const result = unlockedNow ? { text: raw, masked: false } : MTB.maskContact(raw);
            current.messages.push({ from: meSide, name, time: "Just now", text: result.text, shareAttempt: result.masked });
            current.preview = result.text;
            current.updated = "Just now";
            if (result.masked) MTB.toast("Contact details are hidden until your first paid order.");
            draw();
          });
        }
        draw();
      }
    });

  </script>
</body>
</html>
