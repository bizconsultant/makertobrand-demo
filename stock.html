<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ready-made stock · MakerToBrand</title>
  <meta name="description" content="Browse wholesale apparel listings with minimum order quantities and bulk price tiers, in INR.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="demo-bar"></div>
  <header id="site-header"></header>
  <main class="page-pad">
    <div class="wrap-wide page-intro">
      <span class="eyebrow ink">Wholesale</span>
      <h1>Ready-made stock, with honest minimums.</h1>
      <p class="lead">Price breaks fall as the quantity rises. Every listing belongs to a real sample factory in this demo, and checkout holds the payment until delivery.</p>
    </div>
    <div class="wrap-wide layout-filters">
      <aside class="filter-box" id="filters"></aside>
      <div>
        <p class="muted" id="result-count"></p>
        <div class="product-grid" id="grid"></div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/settings.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    MTB.init({
      page: "stock",
      after() {
        const cats = [...new Set(MTB_DATA.products.map((p) => p.category))];
        const cities = [...new Set(MTB_DATA.products.map((p) => MTB.maker(p.makerId).city))];
        const state = { cat: new Set(), city: new Set() };
        document.getElementById("filters").innerHTML =
          `<h3 style="margin-top:0">Category</h3>` +
          cats.map((c) => `<label><input type="checkbox" data-key="cat" value="${c}"> ${c}</label>`).join("") +
          `<h3>Made in</h3>` +
          cities.map((c) => `<label><input type="checkbox" data-key="city" value="${c}"> ${c}</label>`).join("") +
          `<button class="btn btn-ghost btn-sm" type="button" id="clear" style="margin-top:16px">Clear filters</button>`;
        function draw() {
          const list = MTB_DATA.products.filter((p) => {
            const m = MTB.maker(p.makerId);
            if (state.cat.size && !state.cat.has(p.category)) return false;
            if (state.city.size && !state.city.has(m.city)) return false;
            return true;
          });
          document.getElementById("result-count").textContent = list.length + " listing" + (list.length === 1 ? "" : "s");
          document.getElementById("grid").innerHTML = list.length ? list.map(MTB.productCard).join("") : `<div class="empty">No listings match those filters.</div>`;
        }
        document.getElementById("filters").addEventListener("change", (e) => {
          const t = e.target;
          const key = t.getAttribute("data-key");
          if (!key) return;
          if (t.checked) state[key].add(t.value); else state[key].delete(t.value);
          draw();
        });
        document.getElementById("clear").addEventListener("click", () => {
          state.cat.clear(); state.city.clear();
          document.querySelectorAll("#filters input").forEach((i) => i.checked = false);
          draw();
        });
        draw();
      }
    });

  </script>
</body>
</html>
