<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order · MakerToBrand</title>
  <meta name="description" content="Order confirmation. Payment is shown as held securely until delivery, with on-site extras.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="demo-bar"></div>
  <header id="site-header"></header>
  <main class="page-pad"><div class="wrap" id="root"></div></main>

  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    MTB.init({
      page: "cart",
      after() {
        const id = MTB.param("id");
        const order = MTB.allOrders().find((o) => o.id === id) || MTB.allOrders()[0];
        const product = order.productId ? MTB.product(order.productId) : null;
        const maker = order.makerId ? MTB.maker(order.makerId) : (order.items && order.items[0] ? MTB.maker(MTB.product(order.items[0].id).makerId) : null);
        document.title = order.id + " · MakerToBrand";
        const status = order.status;
        const session = MTB.getSession();
        const isSellerView = session && session.role === "manufacturer";
        const fee = MTB.feeFor(order.total, order.makerId ? MTB.maker(order.makerId) : "Pro");
        const feeAmt = order.platformFee != null ? order.platformFee : fee.fee;
        const waived = order.feeWaived || fee.feeWaived;
        const payout = order.makerPayout != null ? order.makerPayout : fee.makerPayout;
        function step(key, label, detail) {
          const orderSteps = ["placed", "held", "production", "inspection", "delivered", "released"];
          const current = { held: "production", deposit: "production", inspection: "inspection", released: "released" }[status] || "held";
          const ci = orderSteps.indexOf(current);
          const si = orderSteps.indexOf(key);
          const cls = si < ci ? "is-done" : si === ci ? "is-now" : "";
          return `<li class="${cls}"><b>${label}</b><span>${detail}</span></li>`;
        }
        document.getElementById("root").innerHTML = `
          <div class="success-panel" style="padding-bottom:24px">
            <span class="eyebrow ink">Payment held</span>
            <h1>Thank you. The amount is safe.</h1>
            <p class="lead" style="margin:0 auto 16px">Order <strong>${order.id}</strong> is confirmed. ${MTB.inr(order.total)} is held until delivery${maker ? " from " + MTB.escapeHtml(maker.name) : ""}. This protection applies only because the order was paid on MakerToBrand. Nothing was actually charged — this is a demo.</p>
            ${MTB.protectBadge()}
          </div>
          <div class="escrow-callout" style="text-align:left;margin:0 0 28px">
            <h3>${order.statusLabel || "Payment held"}</h3>
            <p>Placed ${order.placed || "today"}. Expected ${order.eta || "in the coming weeks"}. ${order.deposit ? "Deposit " + MTB.inr(order.deposit) + " held; balance " + MTB.inr(order.balance) + " is due on delivery." : "The manufacturer can see that funds are secured, and will be paid when you confirm receipt — a guarantee that exists only for on-site orders."}${isSellerView ? (waived ? " Platform fee: waived, Premium. You receive the full " + MTB.inr(order.total) + "." : " A 3% platform fee of " + MTB.inr(feeAmt) + " will be taken from your payout, leaving " + MTB.inr(payout) + ".") : ""}</p>
          </div>
          <div class="profile-grid">
            <div>
              <h2 style="font-size:32px;margin-bottom:14px">Tracking</h2>
              <ul class="timeline">
                ${step("placed", "Order placed", order.placed || "Today")}
                ${step("held", "Payment held on MakerToBrand", "Released only on delivery · Razorpay")}
                ${step("production", "In production", maker ? maker.name : "Manufacturer confirmed")}
                ${step("inspection", "Optional quality inspection", status === "inspection" ? "Requested — awaiting report" : "Available on this on-site order")}
                ${step("delivered", "Shipped / delivered", order.eta ? "Expected " + order.eta : "Date to follow")}
                ${step("released", "Payment released to the factory", status === "released" ? "Released after delivery was confirmed" : "After you confirm receipt")}
              </ul>
            </div>
            <aside>
              <div class="sticky-card" style="position:relative;top:0">
                <span class="badge badge-held">On-site extras</span>
                <h3 style="font-size:26px;margin:8px 0 8px">Included only for orders paid here.</h3>
                <p class="muted">A private deal would not receive these.</p>
                <div class="form-grid" style="margin-top:12px">
                  <a class="btn btn-dark btn-block" href="invoice.html?id=${encodeURIComponent(order.id)}">Download GST invoice</a>
                  <button class="btn btn-ghost btn-block" type="button" id="inspect">Request quality inspection</button>
                  <button class="btn btn-ghost btn-block" type="button" id="reorder">One-click re-order</button>
                  <a class="btn btn-ghost btn-block" href="dashboard-brand.html">Back to dashboard</a>
                  <a class="btn btn-ghost btn-block" href="messages.html">Message the manufacturer</a>
                </div>
              </div>
            </aside>
          </div>
          <div class="extras-grid">
            <div class="extra-card">
              <h3>Shipping</h3>
              <p>Tracked dispatch arranged through the order. Both sides see the same milestones above.</p>
            </div>
            <div class="extra-card">
              <h3>Quality inspection</h3>
              <p>Optional, before payment is released. Available because this order was paid on the site.</p>
            </div>
          </div>`;
        document.getElementById("inspect").addEventListener("click", () => {
          MTB.toast("Quality inspection requested on this on-site order (demo).");
        });
        document.getElementById("reorder").addEventListener("click", () => {
          if (order.productId && product) {
            MTB.addToCart({ id: product.id, qty: order.qty || product.moq, color: (product.colors||[])[0], size: (product.sizes||[])[0], name: product.name, image: product.images[0], makerId: product.makerId, moq: product.moq });
            location.href = "cart.html";
          } else if (order.items && order.items.length) {
            order.items.forEach((item) => MTB.addToCart(item));
            location.href = "cart.html";
          } else {
            MTB.toast("Open a new brief to repeat this custom programme.");
            location.href = "custom.html";
          }
        });
      }
    });
  </script>
</body>
</html>
