<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manufacturer dashboard · MakerToBrand</title>
  <meta name="description" content="A manufacturer's view of enquiries, quotes sent, orders and earnings held or released.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="demo-bar"></div>
  <header id="site-header"></header>
  <main class="page-pad">
    <div class="wrap-wide page-intro">
      <span class="eyebrow ink">Manufacturer dashboard</span>
      <h1 id="hello">Enquiries, quotes, orders and earnings.</h1>
      <p class="lead" id="maker-lead">The view a factory owner would open every morning — work coming in, money still held, money already released.</p>
    </div>
    <div class="wrap-wide">
      <div class="kpi-grid" id="kpis"></div>
      <div class="tabs" id="tabs">
        <button type="button" class="is-on" data-tab="enquiries">Enquiries</button>
        <button type="button" data-tab="quotes">Quotes sent</button>
        <button type="button" data-tab="orders">Orders</button>
        <button type="button" data-tab="earnings">Earnings</button>
      </div>
      <div id="panel"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/settings.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    MTB.init({
      page: "dashboard",
      after() {
        const s = MTB.requireRole("manufacturer");
        const makerId = s.makerId || "loom-lattice";
        const me = MTB.maker(makerId);
        document.getElementById("hello").textContent = (me ? me.name : s.name) + " · enquiries, orders and earnings.";
        document.getElementById("maker-lead").textContent = "The view a factory owner would open every morning — work coming in, money still held, money already released. You are on the " + MTB.inr(MTB.membershipMonth()) + " monthly membership. A " + MTB.commissionLabel() + " commission of the total bill is taken from your payout when payment is released.";
        const myOrders = MTB.allOrders().filter((o) => !o.makerId || o.makerId === makerId);
        function payout(o) {
          if (o.makerPayout != null) return o.makerPayout;
          return MTB.feeFor(o.total, me).makerPayout;
        }
        function feeAmt(o) {
          if (o.platformFee != null) return o.platformFee;
          return MTB.feeFor(o.total, me).fee;
        }
        const held = myOrders.filter((o) => o.status !== "released").reduce((a,o) => a + (o.status === "deposit" && o.deposit ? Math.round(payout(o) * (o.deposit/o.total)) : payout(o)), 0);
        const released = myOrders.filter((o) => o.status === "released").reduce((a,o) => a + payout(o), 0);
        const myQuotes = MTB.allRfqs().flatMap((r) => (r.quotes||[]).filter((q) => q.makerId === makerId).map((q) => Object.assign({ rfq: r }, q)));
        const openBriefs = MTB.allRfqs().filter((r) => r.status !== "accepted");
        document.getElementById("kpis").innerHTML = `
          <div class="kpi"><span>Open briefs to consider</span><b>${openBriefs.length}</b></div>
          <div class="kpi"><span>Quotes sent</span><b>${myQuotes.length}</b></div>
          <div class="kpi"><span>Held for you</span><b>${MTB.inr(held)}</b></div>
          <div class="kpi"><span>Released to you</span><b>${MTB.inr(released)}</b></div>`;
        const views = {
          enquiries() {
            return `<p class="muted">New production briefs across the marketplace. Send a quote from the brief itself.</p>
              <div class="table-wrap"><table class="data"><thead><tr><th>Brief</th><th>Brand</th><th>Qty</th><th>Deadline</th><th></th></tr></thead><tbody>
              ${openBriefs.map((r) => `<tr>
                <td>${MTB.escapeHtml(r.title)}</td>
                <td>${MTB.escapeHtml(r.brand)}</td>
                <td>${Number(r.qty).toLocaleString("en-IN")}</td>
                <td>${r.deadline}</td>
                <td><a class="btn btn-dark btn-sm" href="rfq.html?id=${r.id}">Review &amp; quote</a></td>
              </tr>`).join("")}
              </tbody></table></div>`;
          },
          quotes() {
            return `<div class="table-wrap"><table class="data"><thead><tr><th>Brief</th><th>Your unit price</th><th>Lead</th><th>Status</th></tr></thead><tbody>
              ${myQuotes.map((q) => `<tr>
                <td><a href="rfq.html?id=${q.rfq.id}">${MTB.escapeHtml(q.rfq.title)}</a></td>
                <td>${MTB.inr(q.price)}</td>
                <td>${q.lead}</td>
                <td>${q.rfq.acceptedQuoteId === q.id || localStorage.getItem("mtb_accepted_"+q.rfq.id)===q.id ? '<span class="badge badge-ok">Accepted</span>' : '<span class="badge badge-wait">Awaiting brand</span>'}</td>
              </tr>`).join("") || `<tr><td colspan="4">No quotes sent yet.</td></tr>`}
            </tbody></table></div>`;
          },
          orders() {
            return `<div class="table-wrap"><table class="data"><thead><tr><th>Order</th><th>Brand</th><th>Value</th><th>Status</th></tr></thead><tbody>
              ${myOrders.map((o) => `<tr>
                <td><a href="order.html?id=${o.id}">${o.id}</a><div class="muted">${o.placed}</div></td>
                <td>${MTB.escapeHtml(o.brand)}</td>
                <td>${MTB.inr(o.total)}</td>
                <td><span class="badge ${o.status==="released"?"badge-ok":o.status==="inspection"?"badge-wait":"badge-held"}">${o.statusLabel}</span></td>
              </tr>`).join("")}
            </tbody></table></div>`;
          },
          earnings() {
            const rows = myOrders.map((o) => {
              const comm = feeAmt(o);
              const net = payout(o);
              const releasedAmt = o.status === "released" ? net : "—";
              const heldAmt = o.status !== "released" ? (o.status === "deposit" && o.deposit ? Math.round(net * (o.deposit/o.total)) : net) : "—";
              return `<tr>
                <td>${o.id}</td>
                <td>${MTB.inr(o.total)}</td>
                <td>${MTB.inr(comm)}</td>
                <td>${releasedAmt === "—" ? "—" : MTB.inr(releasedAmt)}</td>
                <td>${heldAmt === "—" ? "—" : MTB.inr(heldAmt)}</td>
              </tr>`;
            }).join("");
            return `<p class="muted">Your membership is ${MTB.inr(MTB.membershipMonth())} a month. A ${MTB.commissionLabel()} commission of the total bill is taken from your payout when payment is released. Brands never see this fee — they pay only the product price.</p>
              <p style="margin:16px 0"><a class="btn btn-ghost btn-sm" href="manufacturer.html?id=${makerId}">View your public profile</a></p>
              <div class="table-wrap"><table class="data"><thead><tr><th>Order</th><th>Gross</th><th>${MTB.commissionLabel()} commission</th><th>Released to you</th><th>Still held</th></tr></thead><tbody>${rows}</tbody></table></div>`;
          }
                };
        let tab = "enquiries";
        function draw() { document.getElementById("panel").innerHTML = views[tab](); }
        document.getElementById("tabs").addEventListener("click", (e) => {
          const b = e.target.closest("[data-tab]");
          if (!b) return;
          tab = b.dataset.tab;
          document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("is-on", x === b));
          draw();
        });
        draw();
      }
    });

  </script>
</body>
</html>
