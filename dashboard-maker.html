<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manufacturer dashboard · MakerToBrand</title>
  <meta name="description" content="A manufacturer's view of enquiries, quotes sent, orders and earnings held or released.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="demo-bar"></div>
  <header id="site-header"></header>
  <main class="page-pad">
    <div class="wrap-wide page-intro">
      <span class="eyebrow ink">Manufacturer dashboard</span>
      <h1 id="hello">Enquiries, quotes, orders and earnings.</h1>
      <p class="lead">The view a factory owner would open every morning — work coming in, money still held, money already released. Repeat partners pay a lower commission on the next on-site order.</p>
    </div>
    <div class="wrap-wide">
      <div class="kpi-grid" id="kpis"></div>
      <div class="tabs" id="tabs">
        <button type="button" class="is-on" data-tab="enquiries">Enquiries</button>
        <button type="button" data-tab="quotes">Quotes sent</button>
        <button type="button" data-tab="orders">Orders</button>
        <button type="button" data-tab="earnings">Earnings</button>
      </div>
      <div id="panel"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    MTB.init({
      page: "dashboard",
      after() {
        const s = MTB.requireRole("manufacturer");
        const makerId = s.makerId || "loom-lattice";
        const me = MTB.maker(makerId);
        document.getElementById("hello").textContent = (me ? me.name : s.name) + " · enquiries, orders and earnings.";
        const myOrders = MTB.allOrders().filter((o) => !o.makerId || o.makerId === makerId);
        const held = myOrders.filter((o) => o.status !== "released").reduce((a,o) => a + (o.deposit || o.total || 0), 0);
        const released = myOrders.filter((o) => o.status === "released").reduce((a,o) => a + o.total, 0);
        const myQuotes = MTB.allRfqs().flatMap((r) => (r.quotes||[]).filter((q) => q.makerId === makerId).map((q) => Object.assign({ rfq: r }, q)));
        const openBriefs = MTB.allRfqs().filter((r) => r.status !== "accepted");
        document.getElementById("kpis").innerHTML = `
          <div class="kpi"><span>Open briefs to consider</span><b>${openBriefs.length}</b></div>
          <div class="kpi"><span>Quotes sent</span><b>${myQuotes.length}</b></div>
          <div class="kpi"><span>Held for you</span><b>${MTB.inr(held)}</b></div>
          <div class="kpi"><span>Released (after commission)</span><b>${MTB.inr(Math.round(released * 0.96))}</b></div>`;
        const views = {
          enquiries() {
            return `<p class="muted">New production briefs across the marketplace. Send a quote from the brief itself.</p>
              <div class="table-wrap"><table class="data"><thead><tr><th>Brief</th><th>Brand</th><th>Qty</th><th>Deadline</th><th></th></tr></thead><tbody>
              ${openBriefs.map((r) => `<tr>
                <td>${MTB.escapeHtml(r.title)}</td>
                <td>${MTB.escapeHtml(r.brand)}</td>
                <td>${Number(r.qty).toLocaleString("en-IN")}</td>
                <td>${r.deadline}</td>
                <td><a class="btn btn-dark btn-sm" href="rfq.html?id=${r.id}">Review &amp; quote</a></td>
              </tr>`).join("")}
              </tbody></table></div>`;
          },
          quotes() {
            return `<div class="table-wrap"><table class="data"><thead><tr><th>Brief</th><th>Your unit price</th><th>Lead</th><th>Status</th></tr></thead><tbody>
              ${myQuotes.map((q) => `<tr>
                <td><a href="rfq.html?id=${q.rfq.id}">${MTB.escapeHtml(q.rfq.title)}</a></td>
                <td>${MTB.inr(q.price)}</td>
                <td>${q.lead}</td>
                <td>${q.rfq.acceptedQuoteId === q.id || localStorage.getItem("mtb_accepted_"+q.rfq.id)===q.id ? '<span class="badge badge-ok">Accepted</span>' : '<span class="badge badge-wait">Awaiting brand</span>'}</td>
              </tr>`).join("") || `<tr><td colspan="4">No quotes sent yet.</td></tr>`}
            </tbody></table></div>`;
          },
          orders() {
            return `<div class="table-wrap"><table class="data"><thead><tr><th>Order</th><th>Brand</th><th>Value</th><th>Status</th></tr></thead><tbody>
              ${myOrders.map((o) => `<tr>
                <td><a href="order.html?id=${o.id}">${o.id}</a><div class="muted">${o.placed}</div></td>
                <td>${MTB.escapeHtml(o.brand)}</td>
                <td>${MTB.inr(o.total)}</td>
                <td><span class="badge ${o.status==="released"?"badge-ok":o.status==="inspection"?"badge-wait":"badge-held"}">${o.statusLabel}</span></td>
              </tr>`).join("")}
            </tbody></table></div>`;
          },
          earnings() {
            const rows = myOrders.map((o) => {
              const comm = o.commission || Math.round(o.total * 0.04);
              const net = (o.deposit && o.status === "deposit") ? Math.round(o.deposit - comm * (o.deposit/o.total)) : (o.status === "released" ? o.total - comm : 0);
              return `<tr>
                <td>${o.id}</td>
                <td>${MTB.inr(o.total)}</td>
                <td>${MTB.inr(comm)}</td>
                <td>${o.status === "released" ? MTB.inr(o.total - comm) : "—"}</td>
                <td>${o.status !== "released" ? MTB.inr(o.deposit || o.total) : "—"}</td>
              </tr>`;
            }).join("");
            const byBrand = {};
            myOrders.forEach((o) => {
              const name = o.brand || "Brand";
              byBrand[name] = byBrand[name] || [];
              byBrand[name].push(o);
            });
            const partnerRows = Object.keys(byBrand).map((name) => {
              const n = byBrand[name].length;
              const next = MTB.loyaltyRate(n);
              const current = MTB.loyaltyRate(Math.max(0, n - 1));
              return `<tr>
                <td>${MTB.escapeHtml(name)}</td>
                <td>${n}</td>
                <td>${MTB.pct(current)} on the latest order</td>
                <td><span class="badge badge-ok">Repeat partner ${MTB.pct(next)}</span> on the next on-site order</td>
              </tr>`;
            }).join("");
            return `<p class="muted">Commission between a brand and your factory starts at 5% on the first on-site order, falls to 3% from the second, and to 2% from the fifth. That repeat-partner rate only applies to orders paid on MakerToBrand.</p>
              <h3 style="font-size:24px;margin:18px 0 10px">Repeat partners</h3>
              <div class="table-wrap"><table class="data"><thead><tr><th>Brand</th><th>Orders together</th><th>Latest rate</th><th>Next order</th></tr></thead><tbody>${partnerRows || "<tr><td colspan=4>No on-site orders yet.</td></tr>"}</tbody></table></div>
              <p style="margin:16px 0"><a class="btn btn-ghost btn-sm" href="pricing.html">Review memberships</a>
              <a class="btn btn-ghost btn-sm" href="manufacturer.html?id=${makerId}">View your public profile</a></p>
              <div class="table-wrap"><table class="data"><thead><tr><th>Order</th><th>Gross</th><th>Commission</th><th>Released to you</th><th>Still held</th></tr></thead><tbody>${rows}</tbody></table></div>`;
          }
        };
        let tab = "enquiries";
        function draw() { document.getElementById("panel").innerHTML = views[tab](); }
        document.getElementById("tabs").addEventListener("click", (e) => {
          const b = e.target.closest("[data-tab]");
          if (!b) return;
          tab = b.dataset.tab;
          document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("is-on", x === b));
          draw();
        });
        draw();
      }
    });

  </script>
</body>
</html>
