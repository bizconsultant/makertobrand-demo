<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · MakerToBrand</title>
  <meta name="description" content="Platform admin view: users, orders, commissions, memberships, and a one-click block account action.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="demo-bar"></div>
  <header id="site-header"></header>
  <main class="page-pad">
    <div class="wrap-wide page-intro">
      <span class="eyebrow ink">Admin</span>
      <h1>The house view.</h1>
      <p class="lead" id="admin-lead">Users, orders, seller commissions, memberships, fair-use flags, and actions to warn, remove a verified badge, or block an account.</p>
    </div>
    <div class="wrap-wide">
      <div class="kpi-grid" id="kpis"></div>
      <div id="flag-box"></div>
      <div class="tabs" id="tabs">
        <button type="button" class="is-on" data-tab="users">Users</button>
        <button type="button" data-tab="orders">Orders</button>
        <button type="button" data-tab="commission">Revenue</button>
        <button type="button" data-tab="edit">Edit rates &amp; content</button>
      </div>
      <div id="panel"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/settings.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    MTB.init({
      page: "admin",
      after() {
        MTB.requireRole("admin");
        document.getElementById("admin-lead").textContent = "Users, orders, seller commissions, the shared " + MTB.inr(MTB.membershipMonth()) + " membership from brands and factories, fair-use flags, and actions to warn, remove a verified badge, or block an account. You can also edit rates and pictures for this browser.";
        const FLAG_KEY = "mtb_fairuse_flag";
        function flagState() {
          try { return JSON.parse(localStorage.getItem(FLAG_KEY) || "null") || { status: "open", badge: true }; }
          catch { return { status: "open", badge: true }; }
        }
        function setFlagState(s) { localStorage.setItem(FLAG_KEY, JSON.stringify(s)); }
        const orders = MTB.allOrders();
        const gmv = orders.reduce((a,o) => a + o.total, 0);
        function users() {
          const blocked = new Set(MTB.getBlocked());
          return MTB_DATA.users.map((u) => Object.assign({}, u, { status: blocked.has(u.id) ? "blocked" : "active" }));
        }
        const listForRev = users();
        const active = listForRev.filter((u) => u.status === "active");
        const brandSubs = active.filter((u) => u.type === "Brand").length;
        const sellerSubs = active.filter((u) => u.type === "Manufacturer").length;
        const brandRev = brandSubs * (MTB_DATA.brandPlan.priceMonth);
        const sellerRev = sellerSubs * (MTB_DATA.sellerPlan.priceMonth);
        const memRev = brandRev + sellerRev;
        const comm = orders.reduce((a,o) => a + (o.commission || o.platformFee || 0), 0);
        const releasedComm = orders.filter((o) => o.status === "released").reduce((a,o) => a + (o.commission || o.platformFee || 0), 0);
        function kpis() {
          const list = users();
          document.getElementById("kpis").innerHTML = `
            <div class="kpi"><span>Users</span><b>${list.length}</b></div>
            <div class="kpi"><span>Gross merchandise</span><b>${MTB.inr(gmv)}</b></div>
            <div class="kpi"><span>Seller commissions</span><b>${MTB.inr(comm)}</b></div>
            <div class="kpi"><span>Memberships this month</span><b>${MTB.inr(memRev)}</b></div>`;
        }
        const views = {
          users() {
            return `<div class="table-wrap"><table class="data"><thead><tr><th>Name</th><th>Type</th><th>City</th><th>Plan</th><th>Joined</th><th>Status</th><th></th></tr></thead><tbody>
              ${users().map((u) => `<tr>
                <td>${MTB.escapeHtml(u.name)}</td>
                <td>${u.type}</td>
                <td>${u.city}</td>
                <td>${u.plan}</td>
                <td>${u.joined}</td>
                <td>${u.status === "blocked" ? '<span class="badge badge-block">Blocked</span>' : '<span class="badge badge-ok">Active</span>'}</td>
                <td>${u.status === "blocked"
                  ? `<button class="btn btn-ghost btn-sm" data-unblock="${u.id}" type="button">Restore</button>`
                  : `<button class="btn btn-danger btn-sm" data-block="${u.id}" type="button">Block account</button>`}</td>
              </tr>`).join("")}
            </tbody></table></div>
            <p class="muted" style="margin-top:12px">Blocking is simulated on this device. In a live product it would stop new orders and hide the public profile.</p>`;
          },
          orders() {
            return `<div class="table-wrap"><table class="data"><thead><tr><th>Order</th><th>Brand</th><th>Manufacturer</th><th>Brand pays</th><th>Seller fee</th><th>Status</th></tr></thead><tbody>
              ${orders.map((o) => {
                const m = o.makerId ? MTB.maker(o.makerId) : null;
                return `<tr>
                  <td><a href="order.html?id=${o.id}">${o.id}</a></td>
                  <td>${MTB.escapeHtml(o.brand)}</td>
                  <td>${m ? MTB.escapeHtml(m.name) : "—"}</td>
                  <td>${MTB.inr(o.brandPays != null ? o.brandPays : o.total)}</td>
                  <td>${MTB.inr(o.commission || o.platformFee || 0)}</td>
                  <td><span class="badge ${o.status==="released"?"badge-ok":"badge-held"}">${o.statusLabel}</span></td>
                </tr>`;
              }).join("")}
            </tbody></table></div>`;
          },
          commission() {
            return `<p class="muted">Seller commission is booked when an order is placed and earned when payment is released. Everyone on the marketplace pays the ${MTB.inr(MTB.membershipMonth())} monthly membership. Manufacturers and wholesalers also pay a ${MTB.commissionLabel()} commission of the total bill, taken from their payout. QuickLot is blocked and is not counted.</p>
              <div class="table-wrap"><table class="data"><thead><tr><th>Source</th><th>Detail</th><th>Amount</th></tr></thead><tbody>
                <tr><td>Released payments</td><td>${MTB.commissionLabel()} seller commission already earned</td><td>${MTB.inr(releasedComm)}</td></tr>
                <tr><td>Held payments</td><td>Seller commission waiting on delivery</td><td>${MTB.inr(comm - releasedComm)}</td></tr>
                <tr><td>Brand memberships</td><td>${brandSubs} active × ${MTB.inr(MTB_DATA.brandPlan.priceMonth)} / month</td><td>${MTB.inr(brandRev)}</td></tr>
                <tr><td>Seller memberships</td><td>${sellerSubs} active manufacturers &amp; wholesalers × ${MTB.inr(MTB_DATA.sellerPlan.priceMonth)} / month</td><td>${MTB.inr(sellerRev)}</td></tr>
                <tr><td colspan="2"><strong>This month, if all held payments released</strong></td><td><strong>${MTB.inr(comm + memRev)}</strong></td></tr>
              </tbody></table></div>`;
          },
          edit() {
            const S = MTB.settings();
            const D = MTB.defaultSettings();
            function field(name, label, value, attrs) {
              return `<label class="field"><span>${label}</span><input name="${name}" value="${MTB.escapeHtml(String(value ?? ""))}" ${attrs || 'type="number" min="0" step="1"'}></label>`;
            }
            const makerRows = (MTB_DATA.manufacturers || []).map((m) => {
              const v = (S.manufacturerMoqs && S.manufacturerMoqs[m.id] != null) ? S.manufacturerMoqs[m.id] : m.moq;
              return `<tr><td>${MTB.escapeHtml(m.name)}<div class="muted">${MTB.escapeHtml(m.city)}</div></td><td><input type="number" min="1" step="1" data-maker-moq="${m.id}" value="${MTB.escapeHtml(String(v))}"></td></tr>`;
            }).join("");
            const productRows = (MTB_DATA.products || []).map((pr) => {
              const v = (S.productMoqs && S.productMoqs[pr.id] != null) ? S.productMoqs[pr.id] : pr.moq;
              return `<tr><td>${MTB.escapeHtml(pr.name)}</td><td><input type="number" min="1" step="1" data-product-moq="${pr.id}" value="${MTB.escapeHtml(String(v))}"></td></tr>`;
            }).join("");
            const imageFields = [
              { key: "homeHero", label: "Home page banner" },
              { key: "designHero", label: "Design & tech-sheet page" },
              { key: "founderNizam", label: "Founder photo — Nizam Uddin" },
              { key: "founderDipankar", label: "Founder photo — Dipankar Bose" },
              { key: "howItWorksBrand", label: "How It Works — for brands" },
              { key: "howItWorksMaker", label: "How It Works — for manufacturers" },
              { key: "qcHero", label: "Quality control page" },
              { key: "signupVisual", label: "Sign-up side picture" },
              { key: "loginVisual", label: "Sign-in side picture" }
            ];
            const imageCards = imageFields.map((f) => {
              const src = MTB.imageSrc(f.key);
              const path = MTB.imagePath(f.key) || (typeof (S.images || {})[f.key] === "string" ? S.images[f.key] : "");
              return `<article class="img-edit" data-image-key="${f.key}">
                <h3>${f.label}</h3>
                <div class="img-edit-preview"><img src="${MTB.escapeHtml(src)}" alt=""></div>
                <label class="field"><span>File path in the images folder</span>
                  <input type="text" data-image-path value="${MTB.escapeHtml(path)}" placeholder="images/your-photo.jpg">
                </label>
                <label class="field"><span>Or pick a new picture to preview in this browser</span>
                  <input type="file" accept="image/*" data-image-file>
                </label>
              </article>`;
            }).join("");
            return `<div class="admin-edit">
              <div class="note-box edit-browser-note">Changes here show only in this browser in the demo; the real site will save for everyone.</div>
              <aside class="help-panel" id="edit-help">
                <span class="eyebrow ink">How to change the live demo for everyone</span>
                <h2>Edit the settings file on GitHub.</h2>
                <ol>
                  <li>Open the settings file: <a href="https://github.com/bizconsultant/makertobrand-demo/blob/main/js/settings.js" target="_blank" rel="noopener">js/settings.js</a>.</li>
                  <li>Click the pencil icon (“Edit this file”) near the top right of the file.</li>
                  <li>Change only the number, or the text inside the quotes. Leave the comma at the end of the line.</li>
                  <li>Scroll to the bottom. Click the green <strong>Commit changes</strong> button. You can leave the message as it is.</li>
                  <li>Wait about one minute, then refresh the demo website to see the new figure.</li>
                </ol>
                <p>To replace a picture for everyone, upload a new file into the <a href="https://github.com/bizconsultant/makertobrand-demo/tree/main/images" target="_blank" rel="noopener">images</a> folder with the <strong>same name</strong>, or upload a new name and change the path in the settings file. A longer guide is in <a href="HOW-TO-EDIT.md">HOW-TO-EDIT.md</a>. Direct edit link: <a href="https://github.com/bizconsultant/makertobrand-demo/edit/main/js/settings.js" target="_blank" rel="noopener">edit settings.js on GitHub</a>.</p>
              </aside>
              <form id="rates-form" class="edit-form">
                <section class="edit-section">
                  <span class="eyebrow ink">Membership</span>
                  <h2>The monthly and yearly plan.</h2>
                  <div class="form-row">
                    ${field("membershipPriceMonth", "Monthly price (rupees, no commas)", S.membershipPriceMonth)}
                    ${field("membershipPriceYear", "Yearly price (rupees, no commas)", S.membershipPriceYear)}
                  </div>
                </section>
                <section class="edit-section">
                  <span class="eyebrow ink">Seller commission</span>
                  <h2>Taken from the factory’s payout.</h2>
                  ${field("sellerCommissionPercent", "Commission percent (write 3 for 3%)", S.sellerCommissionPercent, 'type="number" min="0" max="100" step="0.1"')}
                </section>
                <section class="edit-section">
                  <span class="eyebrow ink">Design &amp; tech-sheet support</span>
                  <h2>Prices per style, in rupees.</h2>
                  <div class="form-row">
                    ${field("designPriceDesignOnly", "Design only", S.designPriceDesignOnly)}
                    ${field("designPriceTechSheetOnly", "Tech sheet only", S.designPriceTechSheetOnly)}
                    ${field("designPriceDesignAndTechSheet", "Design + tech sheet", S.designPriceDesignAndTechSheet)}
                  </div>
                  <label class="field"><span>Label shown next to the prices</span>
                    <input type="text" name="designSampleNote" value="${MTB.escapeHtml(S.designSampleNote || "")}">
                  </label>
                </section>
                <section class="edit-section">
                  <span class="eyebrow ink">Minimum orders</span>
                  <h2>The floor, then each factory and product.</h2>
                  ${field("defaultMoq", "Default minimum order (pieces)", S.defaultMoq, 'type="number" min="1" step="1"')}
                  <h3 style="margin:20px 0 8px;font-size:22px">Manufacturers</h3>
                  <div class="table-wrap"><table class="data"><thead><tr><th>Factory</th><th>MOQ (pieces)</th></tr></thead><tbody>${makerRows}</tbody></table></div>
                  <h3 style="margin:20px 0 8px;font-size:22px">Ready-made products</h3>
                  <div class="table-wrap"><table class="data"><thead><tr><th>Product</th><th>MOQ (pieces)</th></tr></thead><tbody>${productRows}</tbody></table></div>
                </section>
                <section class="edit-section">
                  <span class="eyebrow ink">Pictures</span>
                  <h2>Key banners and founder portraits.</h2>
                  <p class="muted">Pick a file to preview it in this browser, or type a path after you upload a new file to the images folder on GitHub.</p>
                  <div class="img-edit-grid">${imageCards}</div>
                </section>
                <div class="edit-actions">
                  <button class="btn btn-primary" type="submit">Save changes in this browser</button>
                  <button class="btn btn-ghost" type="button" id="reset-rates">Reset to site defaults</button>
                </div>
              </form>
            </div>`;
          }
        };
        let tab = MTB.param("tab") === "edit" ? "edit" : "users";
        function renderFlag() {
          const st = flagState();
          const box = document.getElementById("flag-box");
          const status = st.status === "warned" ? '<span class="badge badge-wait">Warned</span>'
            : st.status === "badge-removed" ? '<span class="badge badge-wait">Verified badge removed</span>'
            : st.status === "blocked" ? '<span class="badge badge-block">Blocked</span>'
            : '<span class="badge badge-block">Flagged: off-platform attempt</span>';
          const actions = st.status === "blocked"
            ? `<button class="btn btn-ghost btn-sm" type="button" data-flag="restore">Restore account</button>`
            : `<button class="btn btn-ghost btn-sm" type="button" data-flag="warn">Warn</button>
               <button class="btn btn-ghost btn-sm" type="button" data-flag="badge">Remove verified badge</button>
               <button class="btn btn-danger btn-sm" type="button" data-flag="block">Block account</button>`;
          box.innerHTML = `<aside class="flag-card">
            ${status}
            <h3>Silverloom Exports tried to move a deal off the site.</h3>
            <p class="muted" style="margin:0">A WhatsApp number was shared in chat on 18 Nov 2026, before any paid order with the brand. The number was masked automatically. Fair-use terms allow a warning, the removal of a verified badge, or a block.</p>
            <div class="flag-actions">${actions}</div>
          </aside>`;
          box.querySelectorAll("[data-flag]").forEach((b) => b.addEventListener("click", () => {
            const act = b.getAttribute("data-flag");
            if (act === "warn") { setFlagState({ status: "warned", badge: st.badge }); MTB.toast("Warning sent to Silverloom Exports."); }
            else if (act === "badge") { setFlagState({ status: "badge-removed", badge: false }); MTB.toast("Verified badge removed from Silverloom Exports."); }
            else if (act === "block") {
              const ids = MTB.getBlocked();
              if (!ids.includes("u14")) ids.push("u14");
              MTB.setBlocked(ids);
              setFlagState({ status: "blocked", badge: false });
              MTB.toast("Silverloom Exports has been blocked.");
            } else if (act === "restore") {
              MTB.setBlocked(MTB.getBlocked().filter((id) => id !== "u14"));
              setFlagState({ status: "open", badge: true });
              MTB.toast("Flag reset for the demo.");
            }
            draw();
          }));
        }
        function hideChromeForEdit() {
          const editing = tab === "edit";
          document.getElementById("kpis").style.display = editing ? "none" : "";
          document.getElementById("flag-box").style.display = editing ? "none" : "";
          const h1 = document.querySelector(".page-intro h1");
          const lead = document.getElementById("admin-lead");
          if (h1) h1.textContent = editing ? "Edit rates and content." : "The house view.";
          if (lead) lead.style.display = editing ? "none" : "";
        }
        function bindEditForm() {
          const form = document.getElementById("rates-form");
          if (!form) return;
          const pendingImages = {};
          form.querySelectorAll(".img-edit").forEach((card) => {
            const key = card.getAttribute("data-image-key");
            const file = card.querySelector("[data-image-file]");
            const preview = card.querySelector("img");
            if (!file) return;
            file.addEventListener("change", () => {
              const f = file.files && file.files[0];
              if (!f) return;
              if (f.size > 1500000) {
                MTB.toast("Please choose a picture under 1.5 MB for this demo preview.");
                file.value = "";
                return;
              }
              const reader = new FileReader();
              reader.onload = () => {
                pendingImages[key] = reader.result;
                if (preview) preview.src = reader.result;
              };
              reader.readAsDataURL(f);
            });
          });
          form.addEventListener("submit", (e) => {
            e.preventDefault();
            const fd = new FormData(form);
            const over = {
              membershipPriceMonth: Number(fd.get("membershipPriceMonth")),
              membershipPriceYear: Number(fd.get("membershipPriceYear")),
              sellerCommissionPercent: Number(fd.get("sellerCommissionPercent")),
              designPriceDesignOnly: Number(fd.get("designPriceDesignOnly")),
              designPriceTechSheetOnly: Number(fd.get("designPriceTechSheetOnly")),
              designPriceDesignAndTechSheet: Number(fd.get("designPriceDesignAndTechSheet")),
              designSampleNote: String(fd.get("designSampleNote") || "").trim(),
              defaultMoq: Number(fd.get("defaultMoq")),
              manufacturerMoqs: {},
              productMoqs: {},
              images: {}
            };
            form.querySelectorAll("[data-maker-moq]").forEach((inp) => {
              over.manufacturerMoqs[inp.getAttribute("data-maker-moq")] = Number(inp.value);
            });
            form.querySelectorAll("[data-product-moq]").forEach((inp) => {
              over.productMoqs[inp.getAttribute("data-product-moq")] = Number(inp.value);
            });
            form.querySelectorAll(".img-edit").forEach((card) => {
              const key = card.getAttribute("data-image-key");
              const path = (card.querySelector("[data-image-path]") || {}).value || "";
              const entry = { path: path.trim() };
              if (pendingImages[key]) entry.dataUrl = pendingImages[key];
              else {
                const current = (MTB.settings().images || {})[key];
                if (current && typeof current === "object" && current.dataUrl) entry.dataUrl = current.dataUrl;
              }
              over.images[key] = entry.dataUrl ? entry : entry.path;
            });
            MTB.setSettingsOverride(over);
            MTB.applySettings();
            MTB.toast("Saved in this browser. Refresh any open page to see the new rates.");
            location.href = "admin.html?tab=edit";
          });
          document.getElementById("reset-rates").addEventListener("click", () => {
            MTB.setSettingsOverride(null);
            MTB.toast("Reset to the site defaults.");
            location.href = "admin.html?tab=edit";
          });
        }
        function draw() {
          kpis();
          renderFlag();
          hideChromeForEdit();
          document.getElementById("panel").innerHTML = views[tab]();
          document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("is-on", x.getAttribute("data-tab") === tab));
          if (tab === "edit") bindEditForm();
          const url = new URL(location.href);
          if (tab === "edit") url.searchParams.set("tab", "edit");
          else url.searchParams.delete("tab");
          history.replaceState(null, "", url);
          document.querySelectorAll("[data-block]").forEach((b) => b.addEventListener("click", () => {
            const ids = MTB.getBlocked();
            if (!ids.includes(b.dataset.block)) ids.push(b.dataset.block);
            MTB.setBlocked(ids);
            const u = MTB_DATA.users.find((x) => x.id === b.dataset.block);
            MTB.toast((u ? u.name : "Account") + " has been blocked.");
            draw();
          }));
          document.querySelectorAll("[data-unblock]").forEach((b) => b.addEventListener("click", () => {
            MTB.setBlocked(MTB.getBlocked().filter((id) => id !== b.dataset.unblock));
            MTB.toast("Account restored.");
            draw();
          }));
        }
        document.getElementById("tabs").addEventListener("click", (e) => {
          const b = e.target.closest("[data-tab]");
          if (!b) return;
          tab = b.dataset.tab;
          document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("is-on", x === b));
          draw();
        });
        draw();
      }
    });

  </script>
</body>
</html>
