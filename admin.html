<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · MakerToBrand</title>
  <meta name="description" content="Platform admin view: users, orders, commission earned, and a one-click block account action.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="demo-bar"></div>
  <header id="site-header"></header>
  <main class="page-pad">
    <div class="wrap-wide page-intro">
      <span class="eyebrow ink">Admin</span>
      <h1>The house view.</h1>
      <p class="lead">Users, orders, commission earned, and a single action to block an account if something is wrong.</p>
    </div>
    <div class="wrap-wide">
      <div class="kpi-grid" id="kpis"></div>
      <div class="tabs" id="tabs">
        <button type="button" class="is-on" data-tab="users">Users</button>
        <button type="button" data-tab="orders">Orders</button>
        <button type="button" data-tab="commission">Commission</button>
      </div>
      <div id="panel"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    MTB.init({
      page: "admin",
      after() {
        MTB.requireRole("admin");
        const orders = MTB.allOrders();
        const gmv = orders.reduce((a,o) => a + o.total, 0);
        const comm = orders.reduce((a,o) => a + (o.commission || Math.round(o.total * 0.045)), 0);
        const releasedComm = orders.filter((o) => o.status === "released").reduce((a,o) => a + (o.commission || 0), 0);
        function users() {
          const blocked = new Set(MTB.getBlocked());
          return MTB_DATA.users.map((u) => Object.assign({}, u, { status: blocked.has(u.id) ? "blocked" : "active" }));
        }
        function kpis() {
          const list = users();
          document.getElementById("kpis").innerHTML = `
            <div class="kpi"><span>Users</span><b>${list.length}</b></div>
            <div class="kpi"><span>Gross merchandise</span><b>${MTB.inr(gmv)}</b></div>
            <div class="kpi"><span>Commission (all orders)</span><b>${MTB.inr(comm)}</b></div>
            <div class="kpi"><span>Commission already released</span><b>${MTB.inr(releasedComm)}</b></div>`;
        }
        const views = {
          users() {
            return `<div class="table-wrap"><table class="data"><thead><tr><th>Name</th><th>Type</th><th>City</th><th>Plan</th><th>Joined</th><th>Status</th><th></th></tr></thead><tbody>
              ${users().map((u) => `<tr>
                <td>${MTB.escapeHtml(u.name)}</td>
                <td>${u.type}</td>
                <td>${u.city}</td>
                <td>${u.plan}</td>
                <td>${u.joined}</td>
                <td>${u.status === "blocked" ? '<span class="badge badge-block">Blocked</span>' : '<span class="badge badge-ok">Active</span>'}</td>
                <td>${u.status === "blocked"
                  ? `<button class="btn btn-ghost btn-sm" data-unblock="${u.id}" type="button">Restore</button>`
                  : `<button class="btn btn-danger btn-sm" data-block="${u.id}" type="button">Block account</button>`}</td>
              </tr>`).join("")}
            </tbody></table></div>
            <p class="muted" style="margin-top:12px">Blocking is simulated on this device. In a live product it would stop new orders and hide the public profile.</p>`;
          },
          orders() {
            return `<div class="table-wrap"><table class="data"><thead><tr><th>Order</th><th>Brand</th><th>Manufacturer</th><th>Value</th><th>Commission</th><th>Status</th></tr></thead><tbody>
              ${orders.map((o) => {
                const m = o.makerId ? MTB.maker(o.makerId) : null;
                return `<tr>
                  <td><a href="order.html?id=${o.id}">${o.id}</a></td>
                  <td>${MTB.escapeHtml(o.brand)}</td>
                  <td>${m ? MTB.escapeHtml(m.name) : "—"}</td>
                  <td>${MTB.inr(o.total)}</td>
                  <td>${MTB.inr(o.commission || 0)}</td>
                  <td><span class="badge ${o.status==="released"?"badge-ok":"badge-held"}">${o.statusLabel}</span></td>
                </tr>`;
              }).join("")}
            </tbody></table></div>`;
          },
          commission() {
            return `<p class="muted">Commission is booked when an order is placed, and earned when payment is released to the manufacturer. Memberships are a second line of income.</p>
              <div class="table-wrap"><table class="data"><thead><tr><th>Source</th><th>Detail</th><th>Amount</th></tr></thead><tbody>
                <tr><td>Released payments</td><td>Commission already earned</td><td>${MTB.inr(releasedComm)}</td></tr>
                <tr><td>Held payments</td><td>Commission waiting on delivery</td><td>${MTB.inr(comm - releasedComm)}</td></tr>
                <tr><td>Pro memberships (demo)</td><td>6 active × ${MTB.inr(4999)} / month</td><td>${MTB.inr(6*4999)}</td></tr>
                <tr><td>Premium memberships (demo)</td><td>4 active × ${MTB.inr(12999)} / month</td><td>${MTB.inr(4*12999)}</td></tr>
                <tr><td colspan="2"><strong>This month, if all held payments released</strong></td><td><strong>${MTB.inr(comm + 6*4999 + 4*12999)}</strong></td></tr>
              </tbody></table></div>`;
          }
        };
        let tab = "users";
        function draw() {
          kpis();
          document.getElementById("panel").innerHTML = views[tab]();
          document.querySelectorAll("[data-block]").forEach((b) => b.addEventListener("click", () => {
            const ids = MTB.getBlocked();
            if (!ids.includes(b.dataset.block)) ids.push(b.dataset.block);
            MTB.setBlocked(ids);
            const u = MTB_DATA.users.find((x) => x.id === b.dataset.block);
            MTB.toast((u ? u.name : "Account") + " has been blocked.");
            draw();
          }));
          document.querySelectorAll("[data-unblock]").forEach((b) => b.addEventListener("click", () => {
            MTB.setBlocked(MTB.getBlocked().filter((id) => id !== b.dataset.unblock));
            MTB.toast("Account restored.");
            draw();
          }));
        }
        document.getElementById("tabs").addEventListener("click", (e) => {
          const b = e.target.closest("[data-tab]");
          if (!b) return;
          tab = b.dataset.tab;
          document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("is-on", x === b));
          draw();
        });
        draw();
      }
    });

  </script>
</body>
</html>
