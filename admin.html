<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · MakerToBrand</title>
  <meta name="description" content="Platform admin view: users, orders, commissions, memberships, and a one-click block account action.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="demo-bar"></div>
  <header id="site-header"></header>
  <main class="page-pad">
    <div class="wrap-wide page-intro">
      <span class="eyebrow ink">Admin</span>
      <h1>The house view.</h1>
      <p class="lead">Users, orders, seller commissions, memberships from brands and factories, fair-use flags, and actions to warn, remove a verified badge, or block an account.</p>
    </div>
    <div class="wrap-wide">
      <div class="kpi-grid" id="kpis"></div>
      <div id="flag-box"></div>
      <div class="tabs" id="tabs">
        <button type="button" class="is-on" data-tab="users">Users</button>
        <button type="button" data-tab="orders">Orders</button>
        <button type="button" data-tab="commission">Revenue</button>
      </div>
      <div id="panel"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    MTB.init({
      page: "admin",
      after() {
        MTB.requireRole("admin");
        const FLAG_KEY = "mtb_fairuse_flag";
        function flagState() {
          try { return JSON.parse(localStorage.getItem(FLAG_KEY) || "null") || { status: "open", badge: true }; }
          catch { return { status: "open", badge: true }; }
        }
        function setFlagState(s) { localStorage.setItem(FLAG_KEY, JSON.stringify(s)); }
        const orders = MTB.allOrders();
        const gmv = orders.reduce((a,o) => a + o.total, 0);
        function users() {
          const blocked = new Set(MTB.getBlocked());
          return MTB_DATA.users.map((u) => Object.assign({}, u, { status: blocked.has(u.id) ? "blocked" : "active" }));
        }
        const listForRev = users();
        const active = listForRev.filter((u) => u.status === "active");
        const brandSubs = active.filter((u) => u.type === "Brand").length;
        const sellerCounts = { Pro: 0, Business: 0, Premium: 0 };
        active.filter((u) => u.type === "Manufacturer").forEach((u) => {
          if (sellerCounts[u.plan] != null) sellerCounts[u.plan] += 1;
        });
        const brandRev = brandSubs * (MTB_DATA.brandPlan.priceMonth);
        const sellerRev = sellerCounts.Pro * 1500 + sellerCounts.Business * 2500 + sellerCounts.Premium * 5000;
        const memRev = brandRev + sellerRev;
        const comm = orders.reduce((a,o) => a + (o.commission || o.platformFee || 0), 0);
        const releasedComm = orders.filter((o) => o.status === "released").reduce((a,o) => a + (o.commission || o.platformFee || 0), 0);
        function kpis() {
          const list = users();
          document.getElementById("kpis").innerHTML = `
            <div class="kpi"><span>Users</span><b>${list.length}</b></div>
            <div class="kpi"><span>Gross merchandise</span><b>${MTB.inr(gmv)}</b></div>
            <div class="kpi"><span>Seller commissions</span><b>${MTB.inr(comm)}</b></div>
            <div class="kpi"><span>Memberships this month</span><b>${MTB.inr(memRev)}</b></div>`;
        }
        const views = {
          users() {
            return `<div class="table-wrap"><table class="data"><thead><tr><th>Name</th><th>Type</th><th>City</th><th>Plan</th><th>Joined</th><th>Status</th><th></th></tr></thead><tbody>
              ${users().map((u) => `<tr>
                <td>${MTB.escapeHtml(u.name)}</td>
                <td>${u.type}</td>
                <td>${u.city}</td>
                <td>${u.plan}</td>
                <td>${u.joined}</td>
                <td>${u.status === "blocked" ? '<span class="badge badge-block">Blocked</span>' : '<span class="badge badge-ok">Active</span>'}</td>
                <td>${u.status === "blocked"
                  ? `<button class="btn btn-ghost btn-sm" data-unblock="${u.id}" type="button">Restore</button>`
                  : `<button class="btn btn-danger btn-sm" data-block="${u.id}" type="button">Block account</button>`}</td>
              </tr>`).join("")}
            </tbody></table></div>
            <p class="muted" style="margin-top:12px">Blocking is simulated on this device. In a live product it would stop new orders and hide the public profile.</p>`;
          },
          orders() {
            return `<div class="table-wrap"><table class="data"><thead><tr><th>Order</th><th>Brand</th><th>Manufacturer</th><th>Brand pays</th><th>Seller fee</th><th>Status</th></tr></thead><tbody>
              ${orders.map((o) => {
                const m = o.makerId ? MTB.maker(o.makerId) : null;
                return `<tr>
                  <td><a href="order.html?id=${o.id}">${o.id}</a></td>
                  <td>${MTB.escapeHtml(o.brand)}</td>
                  <td>${m ? MTB.escapeHtml(m.name) : "—"}</td>
                  <td>${MTB.inr(o.brandPays != null ? o.brandPays : o.total)}</td>
                  <td>${(o.feeWaived || (o.commission===0 && o.platformFee===0)) ? "waived, Premium" : MTB.inr(o.commission || o.platformFee || 0)}</td>
                  <td><span class="badge ${o.status==="released"?"badge-ok":"badge-held"}">${o.statusLabel}</span></td>
                </tr>`;
              }).join("")}
            </tbody></table></div>`;
          },
          commission() {
            return `<p class="muted">Seller commission is booked when an order is placed and earned when payment is released. Brands pay a ₹2,500 subscription and never a checkout fee. Manufacturers and wholesalers pay Pro, Business or Premium memberships. QuickLot is blocked and is not counted.</p>
              <div class="table-wrap"><table class="data"><thead><tr><th>Source</th><th>Detail</th><th>Amount</th></tr></thead><tbody>
                <tr><td>Released payments</td><td>3% seller commission already earned</td><td>${MTB.inr(releasedComm)}</td></tr>
                <tr><td>Held payments</td><td>Seller commission waiting on delivery</td><td>${MTB.inr(comm - releasedComm)}</td></tr>
                <tr><td>Brand subscriptions</td><td>${brandSubs} active × ${MTB.inr(2500)} / month</td><td>${MTB.inr(brandRev)}</td></tr>
                <tr><td>Pro (manufacturers)</td><td>${sellerCounts.Pro} active × ${MTB.inr(1500)} / month</td><td>${MTB.inr(sellerCounts.Pro*1500)}</td></tr>
                <tr><td>Business (manufacturers)</td><td>${sellerCounts.Business} active × ${MTB.inr(2500)} / month</td><td>${MTB.inr(sellerCounts.Business*2500)}</td></tr>
                <tr><td>Premium (manufacturers)</td><td>${sellerCounts.Premium} active × ${MTB.inr(5000)} / month</td><td>${MTB.inr(sellerCounts.Premium*5000)}</td></tr>
                <tr><td colspan="2"><strong>This month, if all held payments released</strong></td><td><strong>${MTB.inr(comm + memRev)}</strong></td></tr>
              </tbody></table></div>`;
          }
        };
        let tab = "users";
        function renderFlag() {
          const st = flagState();
          const box = document.getElementById("flag-box");
          const status = st.status === "warned" ? '<span class="badge badge-wait">Warned</span>'
            : st.status === "badge-removed" ? '<span class="badge badge-wait">Verified badge removed</span>'
            : st.status === "blocked" ? '<span class="badge badge-block">Blocked</span>'
            : '<span class="badge badge-block">Flagged: off-platform attempt</span>';
          const actions = st.status === "blocked"
            ? `<button class="btn btn-ghost btn-sm" type="button" data-flag="restore">Restore account</button>`
            : `<button class="btn btn-ghost btn-sm" type="button" data-flag="warn">Warn</button>
               <button class="btn btn-ghost btn-sm" type="button" data-flag="badge">Remove verified badge</button>
               <button class="btn btn-danger btn-sm" type="button" data-flag="block">Block account</button>`;
          box.innerHTML = `<aside class="flag-card">
            ${status}
            <h3>Silverloom Exports tried to move a deal off the site.</h3>
            <p class="muted" style="margin:0">A WhatsApp number was shared in chat on 18 Nov 2026, before any paid order with the brand. The number was masked automatically. Fair-use terms allow a warning, the removal of a verified badge, or a block.</p>
            <div class="flag-actions">${actions}</div>
          </aside>`;
          box.querySelectorAll("[data-flag]").forEach((b) => b.addEventListener("click", () => {
            const act = b.getAttribute("data-flag");
            if (act === "warn") { setFlagState({ status: "warned", badge: st.badge }); MTB.toast("Warning sent to Silverloom Exports."); }
            else if (act === "badge") { setFlagState({ status: "badge-removed", badge: false }); MTB.toast("Verified badge removed from Silverloom Exports."); }
            else if (act === "block") {
              const ids = MTB.getBlocked();
              if (!ids.includes("u14")) ids.push("u14");
              MTB.setBlocked(ids);
              setFlagState({ status: "blocked", badge: false });
              MTB.toast("Silverloom Exports has been blocked.");
            } else if (act === "restore") {
              MTB.setBlocked(MTB.getBlocked().filter((id) => id !== "u14"));
              setFlagState({ status: "open", badge: true });
              MTB.toast("Flag reset for the demo.");
            }
            draw();
          }));
        }
        function draw() {
          kpis();
          renderFlag();
          document.getElementById("panel").innerHTML = views[tab]();
          document.querySelectorAll("[data-block]").forEach((b) => b.addEventListener("click", () => {
            const ids = MTB.getBlocked();
            if (!ids.includes(b.dataset.block)) ids.push(b.dataset.block);
            MTB.setBlocked(ids);
            const u = MTB_DATA.users.find((x) => x.id === b.dataset.block);
            MTB.toast((u ? u.name : "Account") + " has been blocked.");
            draw();
          }));
          document.querySelectorAll("[data-unblock]").forEach((b) => b.addEventListener("click", () => {
            MTB.setBlocked(MTB.getBlocked().filter((id) => id !== b.dataset.unblock));
            MTB.toast("Account restored.");
            draw();
          }));
        }
        document.getElementById("tabs").addEventListener("click", (e) => {
          const b = e.target.closest("[data-tab]");
          if (!b) return;
          tab = b.dataset.tab;
          document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("is-on", x === b));
          draw();
        });
        draw();
      }
    });

  </script>
</body>
</html>
