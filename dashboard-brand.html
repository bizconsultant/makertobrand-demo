<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brand dashboard · MakerToBrand</title>
  <meta name="description" content="A brand owner's view of orders, production briefs, quotes and messages.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="demo-bar"></div>
  <header id="site-header"></header>
  <main class="page-pad">
    <div class="wrap-wide page-intro">
      <span class="eyebrow ink">Brand dashboard</span>
      <h1 id="hello">Your orders, briefs and conversations.</h1>
      <p class="lead">A quiet desk for a label that buys both stock and custom work. GST invoices, tracking and re-orders are included only for orders paid on the site.</p>
    </div>
    <div class="wrap-wide">
      <div class="kpi-grid" id="kpis"></div>
      <div class="tabs" id="tabs">
        <button type="button" class="is-on" data-tab="orders">Orders</button>
        <button type="button" data-tab="briefs">Production briefs</button>
        <button type="button" data-tab="messages">Messages</button>
      </div>
      <div id="panel"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    MTB.init({
      page: "dashboard",
      after() {
        const s = MTB.requireRole("brand");
        document.getElementById("hello").textContent = s.name + " · orders, briefs and conversations.";
        const orders = MTB.allOrders();
        const rfqs = MTB.allRfqs();
        const openHold = orders.filter((o) => o.status === "held" || o.status === "deposit" || o.status === "inspection").reduce((a,o) => a + (o.deposit || o.total), 0);
        document.getElementById("kpis").innerHTML = `
          <div class="kpi"><span>Open orders</span><b>${orders.length}</b></div>
          <div class="kpi"><span>Amount currently held</span><b>${MTB.inr(openHold)}</b></div>
          <div class="kpi"><span>Active briefs</span><b>${rfqs.filter((r)=>r.status!=="accepted").length}</b></div>
          <div class="kpi"><span>Unread threads</span><b>2</b></div>`;
        const badge = (s) => {
          const map = { held: "badge-held", deposit: "badge-held", inspection: "badge-wait", released: "badge-ok", accepted: "badge-ok", open: "badge-wait", "quotes-in": "badge-held" };
          return map[s] || "badge-wait";
        };
        const views = {
          orders() {
            return `<div class="table-wrap"><table class="data"><thead><tr><th>Order</th><th>What</th><th>Manufacturer</th><th>Value</th><th>Status</th></tr></thead><tbody>
              ${orders.map((o) => {
                const p = o.productId ? MTB.product(o.productId) : null;
                const m = o.makerId ? MTB.maker(o.makerId) : null;
                const label = p ? p.name : (o.rfqId && MTB.rfq(o.rfqId) ? MTB.rfq(o.rfqId).title : "Wholesale basket");
                return `<tr>
                  <td><a href="order.html?id=${o.id}" style="text-decoration:underline">${o.id}</a><div class="muted">${o.placed}</div></td>
                  <td>${MTB.escapeHtml(label)} · ${Number(o.qty || (o.items&&o.items[0]&&o.items[0].qty) || "").toLocaleString("en-IN")} pcs</td>
                  <td>${m ? `<a href="manufacturer.html?id=${m.id}">${MTB.escapeHtml(m.name)}</a>` : "Several"}</td>
                  <td>${MTB.inr(o.total)}</td>
                  <td><span class="badge ${badge(o.status)}">${o.statusLabel}</span>
                    <div class="muted" style="margin-top:6px">
                      <a href="order.html?id=${o.id}">Track</a> ·
                      <a href="invoice.html?id=${o.id}">GST invoice</a> ·
                      <a href="order.html?id=${o.id}">Re-order</a>
                    </div>
                  </td>
                </tr>`;
              }).join("")}
            </tbody></table></div>`;
          },
          briefs() {
            return `<div class="table-wrap"><table class="data"><thead><tr><th>Brief</th><th>Quantity</th><th>Deadline</th><th>Quotes</th><th></th></tr></thead><tbody>
              ${rfqs.map((r) => `<tr>
                <td>${MTB.escapeHtml(r.title)}<div class="muted">${r.posted}</div></td>
                <td>${Number(r.qty).toLocaleString("en-IN")}</td>
                <td>${r.deadline}</td>
                <td><span class="badge ${badge(r.status)}">${(r.quotes||[]).length} · ${r.status==="accepted"?"Accepted":r.status==="open"?"Open":"In"}</span></td>
                <td><a class="btn btn-ghost btn-sm" href="rfq.html?id=${r.id}">Compare</a></td>
              </tr>`).join("")}
            </tbody></table></div>
            <p style="margin-top:16px"><a class="btn btn-dark" href="custom.html">Post a new brief</a></p>`;
          },
          messages() {
            return `<div class="table-wrap"><table class="data"><thead><tr><th>With</th><th>Latest</th><th>When</th><th></th></tr></thead><tbody>
              ${MTB_DATA.threads.map((t) => `<tr>
                <td>${MTB.escapeHtml(t.with)}</td>
                <td>${MTB.escapeHtml(t.preview)}</td>
                <td>${t.updated}</td>
                <td><a class="btn btn-ghost btn-sm" href="messages.html?thread=${t.id}">Open</a></td>
              </tr>`).join("")}
            </tbody></table></div>`;
          }
        };
        let tab = "orders";
        function draw() {
          document.getElementById("panel").innerHTML = views[tab]();
        }
        document.getElementById("tabs").addEventListener("click", (e) => {
          const b = e.target.closest("[data-tab]");
          if (!b) return;
          tab = b.dataset.tab;
          document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("is-on", x === b));
          draw();
        });
        draw();
      }
    });

  </script>
</body>
</html>
