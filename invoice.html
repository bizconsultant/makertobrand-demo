<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GST invoice · MakerToBrand</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    @media print { .demo-bar, .site-header, .site-footer, .no-print { display: none !important; } body { background: #fff; } }
  </style>
</head>
<body>
  <div id="demo-bar"></div>
  <header id="site-header"></header>
  <main class="page-pad">
    <div class="wrap" id="root"></div>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    MTB.init({
      page: "cart",
      after() {
        const order = MTB.allOrders().find((o) => o.id === MTB.param("id")) || MTB.allOrders()[0];
        const maker = order.makerId ? MTB.maker(order.makerId) : null;
        const taxable = Math.round(order.total / 1.18);
        const gst = order.total - taxable;
        document.title = "Invoice " + order.id + " · MakerToBrand";
        document.getElementById("root").innerHTML = `
          <p class="no-print muted"><a href="order.html?id=${order.id}">← Back to the order</a></p>
          <div class="summary-card" style="position:relative;top:0;margin-top:12px">
            <div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap">
              <div>
                <span class="eyebrow ink">Tax invoice · demo</span>
                <h1 style="font-size:36px;margin:4px 0 8px">MakerToBrand</h1>
                <p class="muted">GSTIN: 27AADEM0000D1Z5 (sample)<br>A mock invoice for an on-site order. Not a real tax document.</p>
              </div>
              <div style="text-align:right">
                <strong>${order.id}</strong>
                <div class="muted">Dated ${order.placed || "22 Nov 2026"}</div>
              </div>
            </div>
            <hr class="sep">
            <div class="form-row">
              <div><span class="muted">Bill to</span><p><strong>${MTB.escapeHtml(order.brand)}</strong><br>Sample address, India</p></div>
              <div><span class="muted">Supply from</span><p><strong>${maker ? MTB.escapeHtml(maker.name) : "Manufacturer"}</strong><br>${maker ? maker.city + ", " + maker.state : "India"}</p></div>
            </div>
            <div class="table-wrap">
              <table class="data">
                <thead><tr><th>Description</th><th>Qty</th><th>Amount</th></tr></thead>
                <tbody>
                  <tr><td>Apparel supply, order ${order.id}</td><td>${Number(order.qty || 1).toLocaleString("en-IN")}</td><td>${MTB.inr(taxable)}</td></tr>
                  <tr><td>IGST 18% (illustrative)</td><td></td><td>${MTB.inr(gst)}</td></tr>
                  <tr><td colspan="2"><strong>Total</strong></td><td><strong>${MTB.inr(order.total)}</strong></td></tr>
                </tbody>
              </table>
            </div>
            <p class="muted" style="margin-top:16px">Issued because this order was paid on MakerToBrand. A private deal would not receive this invoice from the platform.</p>
            <div class="hero-actions no-print" style="margin-top:16px">
              <button class="btn btn-dark" type="button" onclick="window.print()">Print or save as PDF</button>
            </div>
          </div>`;
      }
    });
  </script>
</body>
</html>
